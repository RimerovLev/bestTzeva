allowBuilds:
  esbuild: true
  unrs-resolver: false
# esbuild — нативный бандлер Vitest; без его postinstall бинарь не встанет и тесты не запустятся.
onlyBuiltDependencies:
  - esbuild
# unrs-resolver — нативный ускоритель eslint-резолвера, работает и без сборки.
# Явно помечаем его сборку как пропущенную, чтобы pnpm не падал на ERR_PNPM_IGNORED_BUILDS.
ignoredBuiltDependencies:
  - unrs-resolver
# Поднимаем уязвимые транзитивные зависимости (аудит п.5): postcss и source-map-js тянет next.
overrides:
  postcss: ">=8.5.23"
  source-map-js: ">=1.2.2"
