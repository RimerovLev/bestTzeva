# Прод-стек на одной VM (аудит п.4). Образы тянутся из GHCR (их собирает и пушит main.yml),
# инфраструктура (Postgres/Redis/MinIO) — рядом в контейнерах с томами, Caddy терминирует TLS и
# маршрутизирует домены. Секреты — в ops/deploy/.env (НЕ в репозитории; см. .env.prod.example).
#
# Запуск на сервере:  docker compose -f docker-compose.prod.yml --env-file .env pull
#                     docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# ${REGISTRY_IMAGE} = ghcr.io/<owner>/<repo>, ${IMAGE_TAG} = sha-<commit> (или latest).

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [internal]

  # Одноразово создаёт публичный и приватный бакеты.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set m http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} &&
      mc mb -p m/${S3_BUCKET} && mc anonymous set download m/${S3_BUCKET} &&
      mc mb -p m/${S3_BUCKET_PRIVATE} || true"
    networks: [internal]
    restart: "no"

  app:
    image: ${REGISTRY_IMAGE}:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    env_file: .env
    environment:
      # Образ уже стартует в prod-профиле. На одной VM один инстанс — Flyway может мигрировать при
      # старте без гонки (для нескольких инстансов мигрировать отдельным шагом, SPRING_FLYWAY_ENABLED=false).
      SPRING_FLYWAY_ENABLED: "true"
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      S3_PATH_STYLE: "true"
      # S3_ENDPOINT и S3_PUBLIC_BASE_URL — в .env: presigned-ссылки подписываются под endpoint, поэтому
      # он должен быть ДОСТУПЕН браузеру (см. README: managed S3 или MinIO через MEDIA_DOMAIN).
    networks: [internal]

  web:
    image: ${REGISTRY_IMAGE}/web:${IMAGE_TAG}
    restart: unless-stopped
    networks: [internal]
    # NEXT_PUBLIC_* уже вшиты в образ на сборке (build-args в main.yml).

  admin:
    image: ${REGISTRY_IMAGE}/admin:${IMAGE_TAG}
    restart: unless-stopped
    networks: [internal]
    # VITE_API_BASE_URL пуст (same-origin): Caddy проксирует /api админ-домена на app (CSP connect-src 'self').

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app, web, admin]
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      WEB_DOMAIN: ${WEB_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    networks: [internal]

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  caddyconfig:

networks:
  internal:
    # Фиксированная подсеть: TRUSTED_PROXIES указывает на неё, чтобы app доверял X-Forwarded-* от Caddy.
    ipam:
      config:
        - subnet: 172.28.0.0/16
