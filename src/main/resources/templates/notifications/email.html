<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:attr="dir=${dir},lang=${#locale.language}">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${subject}">Tzeva Best</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f5; font-family:Arial,Helvetica,sans-serif;">
<!-- Табличная вёрстка ради совместимости с почтовыми клиентами; инлайн-стили; dir из локали. -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5;">
    <tr>
        <td align="center" style="padding:24px 12px;">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0"
                   th:attr="dir=${dir}"
                   style="max-width:600px; width:100%; background-color:#ffffff; border-radius:8px; overflow:hidden;">
                <!-- Шапка -->
                <tr>
                    <td style="background-color:#1f2937; padding:20px 28px;"
                        th:attr="align=${align}">
                        <span style="color:#ffffff; font-size:20px; font-weight:bold;"
                              th:text="${company}">Tzeva Best</span>
                    </td>
                </tr>
                <!-- Тело -->
                <tr>
                    <td th:attr="dir=${dir},align=${align}"
                        th:style="'padding:28px; color:#111827; font-size:16px; line-height:1.6; text-align:' + ${align} + ';'">
                        <h1 th:text="${subject}"
                            style="margin:0 0 16px 0; font-size:22px; color:#111827;">Subject</h1>
                        <p th:text="${body}" style="margin:0;">Body</p>
                    </td>
                </tr>
                <!-- Подвал -->
                <tr>
                    <td th:attr="align=${align}"
                        th:style="'background-color:#f9fafb; padding:16px 28px; color:#6b7280; font-size:12px; text-align:' + ${align} + ';'">
                        <span th:text="${company}">Tzeva Best</span> &copy; <span th:text="${year}">2026</span>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
