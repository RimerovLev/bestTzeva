# ── Профиль test ──────────────────────────────────────────────
# Интеграционные тесты на Testcontainers. Параметры datasource/redis
# подставляются контейнерами динамически (@ServiceConnection / DynamicPropertySource),
# поэтому здесь их не фиксируем.
spring:
  datasource:
    hikari:
      # Тесты держат несколько кэшированных Spring-контекстов одновременно (разные @TestPropertySource /
      # @MockBean), каждый — со своим пулом к ОБЩЕМУ Postgres-контейнеру. С дефолтом (min-idle == max == 10)
      # неактивные контексты держали бы по 10 соединений и упирали контейнер в max_connections (100).
      # Небольшой пул + быстрый возврат простаивающих соединений снимает это; активному контексту 5
      # соединений хватает (в т.ч. на тесты с двумя параллельными потоками).
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
  # Тесты не должны слать реальную почту.
  mail:
    host: localhost
    port: 1025

management:
  health:
    # В тестах нет SMTP-сервера — иначе mail-индикатор уронит /health в DOWN.
    mail:
      enabled: false
    # S3-бакет создаётся не во всех тестах — не даём s3-индикатору ронять /health.
    s3:
      enabled: false

logging:
  level:
    com.tzevabest: DEBUG
    org.testcontainers: INFO
    org.flywaydb: WARN
