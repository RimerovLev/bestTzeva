# ── Профиль prod ──────────────────────────────────────────────
# Все подключения обязаны приходить из переменных окружения — дефолтов нет,
# чтобы приложение не стартовало с небезопасными значениями по умолчанию.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
  jpa:
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  storage:
    s3:
      endpoint: ${S3_ENDPOINT}
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
      bucket: ${S3_BUCKET}
      private-bucket: ${S3_BUCKET_PRIVATE}
      region: ${S3_REGION}
      path-style-access: ${S3_PATH_STYLE:false}

  jwt:
    # В prod секрет обязателен (без дефолта).
    secret: ${JWT_SECRET}
  notification:
    # В prod оба секрета обязательны (без дефолтов), как JWT_SECRET (R-66).
    webhook-secret: ${NOTIFICATION_WEBHOOK_SECRET}
    unsubscribe-secret: ${NOTIFICATION_UNSUBSCRIBE_SECRET}
  spam:
    # Обязателен в prod: с дефолтом токены антиспам-форм подделываемы (секрет публичен в репозитории).
    signing-secret: ${SPAM_SIGNING_SECRET}
  privacy:
    # Обязателен в prod: с дефолтом псевдонимы анонимизации предсказуемы (соль публична).
    pseudonym-secret: ${PRIVACY_PSEUDONYM_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    # CIDR доверенных прокси (ALB). ClientIpResolver берёт реальный IP из X-Forwarded-For
    # только если непосредственный отправитель входит в этот список (иначе XFF игнорируется).
    trusted-proxies: ${TRUSTED_PROXIES}

# Примечание: X-Forwarded-Proto/https для URL возврата эквайринга (T-8.2) настраивается там же,
# отдельно от резолвинга IP, чтобы ForwardedHeaderFilter не срезал X-Forwarded-For до ClientIpResolver.

# В проде документация выключена целиком (и Security закрывает пути денайлом).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.tzevabest: INFO
