spring:
  application:
    name: tzeva-best

  # Active profile: local (dev), test, or prod. Overridable via SPRING_PROFILES_ACTIVE.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tzevabest}
    username: ${DB_USERNAME:tzevabest}
    password: ${DB_PASSWORD:tzevabest_secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

  servlet:
    multipart:
      # Лимиты загрузки заданы осознанно (R-69): импорт каталога 5000 строк в XLSX не влезает в
      # дефолтные 1 МБ. Превышение отдаётся 413 problem+json (GlobalExceptionHandler).
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:20MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:25MB}

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    time-zone: Asia/Jerusalem
    serialization:
      # Даты в ISO-8601, а не числовым timestamp.
      write-dates-as-timestamps: false
    deserialization:
      # Оставляем строгий разбор входящих DTO — неизвестные поля => ошибка.
      fail-on-unknown-properties: true
    mapper:
      # enum из тела запроса принимаются в любом регистре (in_progress == IN_PROGRESS).
      accept-case-insensitive-enums: true

server:
  port: ${SERVER_PORT:8080}
  # Версия API задаётся префиксом /api/v1 на уровне маппинга (@RestController),
  # а не context-path — actuator, swagger и статика остаются в корне.
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    # Выпадающий список групп: public и admin.
    urls-primary-name: public

app:
  vat:
    rate: ${APP_VAT_RATE:0.18}
  mail:
    from: ${MAIL_FROM:noreply@tzevabest.co.il}
  jwt:
    # dev-дефолт длиной >= 32 байт (HS256); в prod задаётся из окружения.
    secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-please-32b}
    issuer: tzeva-best
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P30D}
  auth:
    max-sessions: ${AUTH_MAX_SESSIONS:5}
    default-locale: he
    # Публичная регистрация закрыта: аккаунты заводит администратор. Обратимо флагом.
    public-registration-enabled: ${AUTH_PUBLIC_REGISTRATION:false}
    # Refresh-токен в httpOnly-куке (B-01). Secure выключается только в local/test (там http).
    refresh-cookie:
      enabled: ${AUTH_REFRESH_COOKIE_ENABLED:true}
      name: refresh_token
      path: /api/v1/auth
      same-site: Lax
      secure: ${AUTH_REFRESH_COOKIE_SECURE:true}
    # Запасной путь для клиентов без кук (мобильное приложение): приём и выдача refresh в теле.
    refresh-token-in-body: ${AUTH_REFRESH_TOKEN_IN_BODY:false}
  bootstrap:
    # Первый администратор создаётся один раз на пустой таблице users, если заданы обе переменные.
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  privacy:
    # Версия редакции текста согласия; пишется в consents.policy_version (T-14.2).
    policy-version: ${PRIVACY_POLICY_VERSION:2026-08-01}
    # Срок хранения фото помещений из заявок после завершения/отказа (T-14.2).
    photo-retention: ${PRIVACY_PHOTO_RETENTION:P365D}
    photo-purge-sweep: ${PRIVACY_PHOTO_PURGE_SWEEP:PT24H}
    # Соль для псевдонимизации контактов при анонимизации (R-59/R-64). В prod — из окружения.
    pseudonym-secret: ${PRIVACY_PSEUDONYM_SECRET:dev-only-pseudonym-secret-change-me}
  service:
    # Автораспределение заявок на покраску по кругу (T-11.3) — за флагом, по умолчанию выключено.
    auto-assign-enabled: ${SERVICE_AUTO_ASSIGN:false}
    # Срок жизни неиспользованной presigned-загрузки фото до уборки (R-67).
    upload-intent-retention: ${SERVICE_UPLOAD_INTENT_RETENTION:P1D}
    upload-intent-sweep: ${SERVICE_UPLOAD_INTENT_SWEEP:PT1H}
  audit:
    # Срок хранения журнала аудита (T-13.3); старше — удаляется фоновой задачей.
    retention: ${AUDIT_RETENTION:P730D}
    sweep: ${AUDIT_SWEEP:PT24H}
  spam:
    # Секрет подписи токена формы (T-11.1.1). В prod — из окружения.
    signing-secret: ${SPAM_SIGNING_SECRET:dev-only-spam-form-token-secret-change-me}
    # Минимальное время заполнения формы, сек: быстрее — тихо отбрасываем.
    min-fill-seconds: ${SPAM_MIN_FILL_SECONDS:3}
  catalog:
    # Порог градации наличия в публичной карточке: > порога — many, 1..порог — few, 0 — out_of_stock.
    stock-few-threshold: ${CATALOG_STOCK_FEW_THRESHOLD:10}
  inventory:
    # Срок резерва остатка под заявку; по истечении заявка уходит в LOST.
    reservation-ttl: ${INVENTORY_RESERVATION_TTL:PT72H}
    # Период фоновой уборки просроченных резервов.
    reservation-sweep: ${INVENTORY_RESERVATION_SWEEP:PT5M}
  web:
    # Базовый URL для ссылок в письмах (подтверждение email, сброс пароля).
    base-url: ${APP_BASE_URL:http://localhost:8080}
    # URL админки — для ссылок, которые ведут на экран сотрудника (приглашение/установка пароля).
    admin-url: ${APP_ADMIN_URL:http://localhost:5173}
  notification:
    # Период разбора очереди уведомлений (transactional outbox, T-12.2).
    dispatch-interval: ${NOTIFICATION_DISPATCH_INTERVAL:PT30S}
    # Разные контуры доверия (R-66): секрет вебхуков известен внешнему провайдеру, секрет отписки —
    # только нам. Разведены, чтобы утечка одного не компрометировала другой. В prod — из окружения.
    webhook-secret: ${NOTIFICATION_WEBHOOK_SECRET:dev-only-notification-webhook-secret-change-me}
    unsubscribe-secret: ${NOTIFICATION_UNSUBSCRIBE_SECRET:dev-only-notification-unsubscribe-secret-change-me}
    # Срок действия токена отписки (R-62): по истечении ссылка недействительна.
    unsubscribe-ttl: ${NOTIFICATION_UNSUBSCRIBE_TTL:P30D}
    whatsapp:
      # WhatsApp Business API за флагом (T-12.3): по умолчанию выключен.
      enabled: ${NOTIFICATION_WHATSAPP_ENABLED:false}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  storage:
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      access-key: ${S3_ACCESS_KEY:minioadmin}
      secret-key: ${S3_SECRET_KEY:minioadmin}
      bucket: ${S3_BUCKET:tzevabest-media}
      # Приватный бакет для фото заявок (персональные данные) — только presigned GET.
      private-bucket: ${S3_BUCKET_PRIVATE:tzevabest-private}
      region: ${S3_REGION:us-east-1}
      # MinIO and other S3-compatible stores require path-style URLs.
      path-style-access: ${S3_PATH_STYLE:true}
      # База для публичных ссылок на медиа; пусто → берётся endpoint (dev/MinIO). В проде — CDN/домен.
      public-base-url: ${S3_PUBLIC_BASE_URL:}
