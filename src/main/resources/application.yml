spring:
  application:
    name: tzeva-best

  # Active profile: local (dev), test, or prod. Overridable via SPRING_PROFILES_ACTIVE.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tzevabest}
    username: ${DB_USERNAME:tzevabest}
    password: ${DB_PASSWORD:tzevabest_secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    time-zone: Asia/Jerusalem
    serialization:
      # Даты в ISO-8601, а не числовым timestamp.
      write-dates-as-timestamps: false
    deserialization:
      # Оставляем строгий разбор входящих DTO — неизвестные поля => ошибка.
      fail-on-unknown-properties: true
    mapper:
      # enum из тела запроса принимаются в любом регистре (in_progress == IN_PROGRESS).
      accept-case-insensitive-enums: true

server:
  port: ${SERVER_PORT:8080}
  # Версия API задаётся префиксом /api/v1 на уровне маппинга (@RestController),
  # а не context-path — actuator, swagger и статика остаются в корне.
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    # Выпадающий список групп: public и admin.
    urls-primary-name: public

app:
  vat:
    rate: ${APP_VAT_RATE:0.18}
  mail:
    from: ${MAIL_FROM:noreply@tzevabest.co.il}
  jwt:
    # dev-дефолт длиной >= 32 байт (HS256); в prod задаётся из окружения.
    secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-please-32b}
    issuer: tzeva-best
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P30D}
  auth:
    max-sessions: ${AUTH_MAX_SESSIONS:5}
    default-locale: he
  privacy:
    # Версия редакции текста согласия; пишется в consents.policy_version (T-14.2).
    policy-version: ${PRIVACY_POLICY_VERSION:2026-08-01}
  web:
    # Базовый URL для ссылок в письмах (подтверждение email, сброс пароля).
    base-url: ${APP_BASE_URL:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  storage:
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      access-key: ${S3_ACCESS_KEY:minioadmin}
      secret-key: ${S3_SECRET_KEY:minioadmin}
      bucket: ${S3_BUCKET:tzevabest-media}
      # Приватный бакет для фото заявок (персональные данные) — только presigned GET.
      private-bucket: ${S3_BUCKET_PRIVATE:tzevabest-private}
      region: ${S3_REGION:us-east-1}
      # MinIO and other S3-compatible stores require path-style URLs.
      path-style-access: ${S3_PATH_STYLE:true}
