services:

  postgres:
    image: postgres:16
    container_name: tzevabest-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-tzevabest}
      POSTGRES_USER: ${DB_USERNAME:-tzevabest}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tzevabest_secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-tzevabest} -d ${DB_NAME:-tzevabest}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    container_name: tzevabest-redis
    # noeviction: Redis хранит refresh-токены (T-3.1) и корзины (T-6.1) — вытеснять их
    # нельзя. Истечение — только явными TTL; при нехватке памяти запись упадёт с ошибкой,
    # а не молча выкинет данные.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: tzevabest-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: tzevabest-minio-init
    depends_on:
      minio:
        condition: service_healthy
    # Два бакета: публичный (каталог/портфолио, anon download) и приватный (фото заявок
    # клиентов — персональные данные под израильским законом; выдача только по presigned GET).
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/${S3_BUCKET:-tzevabest-media};
      mc anonymous set download local/${S3_BUCKET:-tzevabest-media};
      mc mb --ignore-existing local/${S3_BUCKET_PRIVATE:-tzevabest-private};
      mc anonymous set none local/${S3_BUCKET_PRIVATE:-tzevabest-private};
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}

  mailpit:
    image: axllent/mailpit:latest
    container_name: tzevabest-mailpit
    ports:
      - "${MAIL_SMTP_PORT:-1025}:1025"
      - "${MAIL_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025/"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  miniodata:
