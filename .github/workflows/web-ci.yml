name: Web CI

on:
  pull_request:
    branches: [ main ]
    paths: [ 'web/**', '.github/workflows/web-ci.yml' ]

defaults:
  run:
    working-directory: web

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      # Типы API сгенерированы из openapi/public.json и закоммичены. Если спецификация
      # обновлена (pnpm spec:pull), а типы не перегенерированы — сборка падает здесь,
      # а не проявляется расхождением в рантайме.
      - name: API types are in sync with the spec
        run: pnpm gen:api:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
