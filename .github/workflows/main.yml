name: Build & deploy

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - run: ./gradlew --no-daemon check

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: | # тег по git-хешу и семантической версии
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64 # ARM — для Oracle Always Free (Ampere A1)
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1' # HIGH/CRITICAL в образе блокируют публикацию (аудит п.4)
          ignore-unfixed: true

  # Образ витрины (Next standalone). NEXT_PUBLIC_* инлайнятся на сборке — передаём как build-args.
  image-web:
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./web
          platforms: linux/amd64,linux/arm64 # ARM — для Oracle Always Free (Ampere A1)
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}/web:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
      - name: Scan web image (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE }}/web:sha-${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  # Образ админки (nginx раздаёт статику Vite с CSP и заголовками безопасности).
  image-admin:
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./admin
          platforms: linux/amd64,linux/arm64 # ARM — для Oracle Always Free (Ampere A1)
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}/admin:sha-${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
      - name: Scan admin image (Trivy)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE }}/admin:sha-${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

  # VM + docker-compose (ops/deploy): по SSH тянем свежие образы и поднимаем стек. Миграции применяет
  # app при старте (один инстанс на VM — гонки нет; SPRING_FLYWAY_ENABLED=true в ops/deploy/.env).
  # .env живёт на VM и в CI не передаётся. Секреты окружения: DEPLOY_SSH_{HOST,USER,KEY}, DEPLOY_PATH;
  # var API_DOMAIN — для smoke по readiness.
  deploy-staging:
    needs: [image, image-web, image-admin]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to staging over SSH
        run: |
          install -m 600 /dev/stdin "$HOME/deploy_key" <<< "${{ secrets.DEPLOY_SSH_KEY }}"
          ssh -o StrictHostKeyChecking=accept-new -i "$HOME/deploy_key" \
            "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}' && export IMAGE_TAG=sha-${{ github.sha }} && \
             docker compose -f docker-compose.prod.yml --env-file .env pull && \
             docker compose -f docker-compose.prod.yml --env-file .env up -d && \
             curl -fsS --retry 10 --retry-delay 6 --retry-all-errors https://${{ vars.API_DOMAIN }}/actuator/health/readiness"

  deploy-prod:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production # ручное подтверждение (protection rule); прежний IMAGE_TAG — для отката
    steps:
      - name: Deploy to prod over SSH
        run: |
          install -m 600 /dev/stdin "$HOME/deploy_key" <<< "${{ secrets.DEPLOY_SSH_KEY }}"
          ssh -o StrictHostKeyChecking=accept-new -i "$HOME/deploy_key" \
            "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" \
            "cd '${{ secrets.DEPLOY_PATH }}' && export IMAGE_TAG=sha-${{ github.sha }} && \
             docker compose -f docker-compose.prod.yml --env-file .env pull && \
             docker compose -f docker-compose.prod.yml --env-file .env up -d && \
             curl -fsS --retry 10 --retry-delay 6 --retry-all-errors https://${{ vars.API_DOMAIN }}/actuator/health/readiness"
