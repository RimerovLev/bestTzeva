# Раздача SPA-админки со строгими заголовками безопасности и CSP (аудит п.11).
# Админка — SPA, где access-токен держится только в памяти, поэтому CSP — главный барьер XSS.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Заголовки безопасности для всех ответов.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP: Vite-сборка грузит только собственные хэшированные модули (без inline-скриптов).
    # connect-src 'self' — API ожидается на том же origin (VITE_API_BASE_URL пуст, /api проксируется);
    # при API на другом домене добавить его origin в connect-src при деплое.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Статика с хэшами в имени — кэшируем надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA-маршрутизация: любой путь отдаёт index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
